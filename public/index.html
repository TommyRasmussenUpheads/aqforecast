<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AqForecast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--color-background-tertiary,#f0f4f8);color:var(--color-text-primary,#1a202c);min-height:100vh;padding:2rem 1rem}
.container{max-width:700px;margin:0 auto}
.header{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.header h1{font-size:1.1rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-secondary)}
.dot{width:8px;height:8px;border-radius:50%;background:#48bb78;flex-shrink:0}
.updated{margin-left:auto;font-size:.75rem;color:var(--color-text-tertiary)}
.tabs{display:flex;gap:4px;background:var(--color-background-secondary);border-radius:10px;padding:4px;margin-bottom:1.5rem}
.tab{flex:1;padding:.5rem;border:none;background:transparent;border-radius:7px;font-size:.85rem;font-weight:500;color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.date-panel{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px}
.date-panel label{font-size:.85rem;color:var(--color-text-secondary);font-weight:500;white-space:nowrap}
.spinner{width:28px;height:28px;border:3px solid var(--color-border-tertiary);border-top-color:#48bb78;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.toggle.open svg{transform:rotate(180deg)}
.toggle svg{transition:transform .2s}
.hourly-row:last-child{border-bottom:none!important}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="dot"></div>
    <h1>AqForecast &mdash; Kristiansand</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-btn-forecast" onclick="switchTab('forecast')">Prognose</button>
    <button class="tab" id="tab-btn-history" onclick="switchTab('history')">Historikk</button>
    <button class="tab" id="tab-btn-calendar" onclick="switchTab('calendar')">Kalender</button>
  </div>

  <!-- FORECAST -->
  <div id="tab-forecast">
    <div id="forecast-root"><div style="text-align:center;padding:3rem 0;color:var(--color-text-secondary)"><div class="spinner"></div>Henter værdata...</div></div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" style="display:none">
    <div class="date-panel">
      <label for="hist-date">Velg dato</label>
      <input type="date" id="hist-date" max="">
      <button id="hist-btn" onclick="fetchHistory()">Vis</button>
    </div>
    <div id="history-root"></div>
  </div>

  <!-- CALENDAR -->
  <div id="tab-calendar" style="display:none">
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <button onclick="calPrev()" style="background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 10px;cursor:pointer;color:var(--color-text-primary)">
          <i class="ti ti-chevron-left" style="font-size:16px" aria-hidden="true"></i>
        </button>
        <span id="cal-title" style="font-size:1rem;font-weight:500"></span>
        <button onclick="calNext()" style="background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 10px;cursor:pointer;color:var(--color-text-primary)">
          <i class="ti ti-chevron-right" style="font-size:16px" aria-hidden="true"></i>
        </button>
      </div>
      <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
    </div>
    <div id="cal-detail"></div>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
